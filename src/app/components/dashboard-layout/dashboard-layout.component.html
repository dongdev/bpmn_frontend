    <nz-layout class="app-layout" style="height: 100vh;">
      
      <!-- SIDEBAR -->
      <nz-sider nzCollapsible [(nzCollapsed)]="isCollapsed" [nzWidth]="256" nzTheme="dark" class="sidebar">
        <div class="sidebar-logo" style="height: 64px; display: flex; align-items: center; justify-content: center; background: #002140; color: #fff; gap: 8px;">
          <span nz-icon nzType="dashboard" style="font-size: 24px; color: #1890ff;"></span>
          <span *ngIf="!isCollapsed" style="font-weight: bold; font-size: 16px;">Camunda Angular</span>
        </div>

        <ul nz-menu nzTheme="dark" nzMode="inline">
          <!-- Sử dụng routerLink thay cho click switchView -->
          <li nz-menu-item *ngFor="let m of allowedMenus" 
              [nzSelected]="isActiveRoute('/dashboard/' + m.id)" 
              [routerLink]="['/dashboard', m.id]">
            <span nz-icon [nzType]="getAntIcon(m.icon)"></span>
            <span *ngIf="!isCollapsed" style="margin-left: 8px;">{{ m.label }}</span>
          </li>
        </ul>
      </nz-sider>

      <nz-layout>
        
        <!-- HEADER -->
        <nz-header style="background: #fff; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,21,41,.08); z-index: 10;">
          
          <!-- Left side toggle button -->
          <span class="trigger" (click)="isCollapsed = !isCollapsed" style="font-size: 18px; cursor: pointer;">
            <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
          </span>

          <!-- Right side user info & Dev Mock mode profile selector -->
          <div style="display: flex; align-items: center; gap: 16px;">
            
            <!-- Dev Mode Roles Quick Selector -->
            <div *ngIf="isMockMode" style="display: flex; align-items: center; gap: 8px; background: #fff2e8; padding: 4px 12px; border: 1px solid #ffd591; border-radius: 4px;">
              <span style="font-size: 12px; color: #d46b08; font-weight: bold;">[DEV MOCK] Chọn Vai Trò:</span>
              <nz-select [ngModel]="activeMockRole" (ngModelChange)="changeMockRole($event)" nzSize="small" style="width: 130px;">
                <nz-option nzLabel="System Admin" nzValue="admin"></nz-option>
                <nz-option nzLabel="Maker (Tạo)" nzValue="maker"></nz-option>
                <nz-option nzLabel="Checker (Duyệt)" nzValue="checker"></nz-option>
              </nz-select>
            </div>

            <!-- Profile Dropdown -->
            <a nz-dropdown [nzDropdownMenu]="userMenu" nzPlacement="bottomRight" style="display: flex; align-items: center; gap: 8px; color: #333;">
              <nz-avatar nzSize="small" nzIcon="user" style="background-color: #1890ff;"></nz-avatar>
              <span style="font-weight: 500;">{{ userProfile?.firstName || userProfile?.username || 'User' }}</span>
              <span nz-icon nzType="down" style="font-size: 10px;"></span>
            </a>

            <nz-dropdown-menu #userMenu="nzDropdownMenu">
              <ul nz-menu>
                <li nz-menu-group nzTitle="Tài khoản">
                  <div style="padding: 4px 12px; font-size: 12px; color: #888;">
                    <strong>{{ userProfile?.firstName }} {{ userProfile?.lastName }}</strong><br/>
                    Email: {{ userProfile?.email || 'N/A' }}
                  </div>
                </li>
                <li nz-menu-divider></li>
                <li nz-menu-item nzDanger (click)="logout()">
                  <span nz-icon nzType="logout" style="margin-right: 8px;"></span> Đăng xuất
                </li>
              </ul>
            </nz-dropdown-menu>

          </div>
        </nz-header>

        <!-- CONTENT -->
        <nz-content style="margin: 24px 16px; padding: 24px; background: #fff; min-height: 280px; overflow: auto; border-radius: 4px;">
          
          <!-- Sử dụng router-outlet thay cho *ngIf component -->
          <router-outlet></router-outlet>

        </nz-content>

      </nz-layout>
    </nz-layout>
